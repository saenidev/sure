      heading: "Scenario bands"
      description: "See the deterministic low, middle, and high outcome across your scenario stacks for each projected month. These are scenario bands, not statistical percentiles."
      disclaimer: "These are deterministic scenario bands — the low, middle, and high outcome across your scenario stacks each month. They are not statistical percentiles, confidence intervals, or a Monte Carlo simulation."
      band_labels:
        deterministic_low: "Low"
        deterministic_mid: "Middle"
        deterministic_high: "High"
      metrics:
        net_worth: "Net worth"
        cash_balance: "Cash balance"
        debt_balance: "Debt balance"
