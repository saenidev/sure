      perturbations:
        income_minus_10pct: "Income -10%"
        expenses_plus_10pct: "Expenses +10%"
        market_return_minus_20pct: "Market return -20%"
        debt_rate_plus_200bps: "Debt rate +200bps"
      table:
        caption: "Impact of each single-variable perturbation on end-of-horizon balances, minimum cash runway, and goal status, versus the baseline run."
        perturbation: "Change"
        cash_balance: "End cash"
        net_worth: "End net worth"
        debt_balance: "End debt"
        minimum_cash_runway_days: "Min runway"
        goal_changes: "Goal changes"
        no_goal_changes: "No change"
        unavailable: "—"
      delta:
        baseline_aria: "Baseline %{value}"
        increase_aria: "%{value} higher than baseline"
        decrease_aria: "%{value} lower than baseline"
        unchanged_aria: "Unchanged from baseline"
      goal_change:
        # %{goal} is the goal's name, %{from}/%{to} are humanized evaluation
        # statuses (On track, At risk, Missed, Blocking, Not yet evaluated).
        summary: "%{goal}: %{from} → %{to}"
        unknown_goal: "A goal"
      runway:
        unbounded: "No limit"
        days:
          one: "%{count} day"
          other: "%{count} days"
        delta_days:
          one: "%{count} day"
          other: "%{count} days"
