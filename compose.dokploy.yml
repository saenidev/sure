# Dokploy production compose file for deploying this repository.
#
# Keep domains, certificates, and secrets in Dokploy. Dokploy can attach
# Traefik labels through its domain settings; this file only defines the
# application services, persistent volumes, and Dokploy network attachment.

x-db-env: &db_env
  POSTGRES_USER: ${POSTGRES_USER:-sure_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:-sure_production}

x-rails-env: &rails_env
  <<: *db_env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
  SELF_HOSTED: "true"
  RAILS_FORCE_SSL: ${RAILS_FORCE_SSL:-true}
  RAILS_ASSUME_SSL: ${RAILS_ASSUME_SSL:-true}
  DB_HOST: db
  DB_PORT: 5432
  REDIS_URL: redis://redis:6379/1
  OPENAI_ACCESS_TOKEN: ${OPENAI_ACCESS_TOKEN:-}
  TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:-}
  PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
  PLAID_SECRET: ${PLAID_SECRET:-}
  PLAID_ENV: ${PLAID_ENV:-production}
  SIMPLEFIN_INCLUDE_PENDING: ${SIMPLEFIN_INCLUDE_PENDING:-1}
  PLAID_INCLUDE_PENDING: ${PLAID_INCLUDE_PENDING:-1}
  LUNCHFLOW_INCLUDE_PENDING: ${LUNCHFLOW_INCLUDE_PENDING:-1}
  MCP_API_TOKEN: ${MCP_API_TOKEN:-}
  MCP_USER_EMAIL: ${MCP_USER_EMAIL:-}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:-}

x-sure-image: &sure_image
  image: ${SURE_IMAGE:-sure-dokploy:local}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-dokploy}

services:
  web:
    <<: *sure_image
    restart: unless-stopped
    volumes:
      - app-storage:/rails/storage
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:3000/up || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.${DOKPLOY_APP_NAME:-sure}-web.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)
      - traefik.http.routers.${DOKPLOY_APP_NAME:-sure}-web.entrypoints=web
      - traefik.http.routers.${DOKPLOY_APP_NAME:-sure}-web.service=${DOKPLOY_APP_NAME:-sure}-web-svc
      - traefik.http.routers.${DOKPLOY_APP_NAME:-sure}-web.middlewares=redirect-to-https@file
      - traefik.http.services.${DOKPLOY_APP_NAME:-sure}-web-svc.loadbalancer.server.port=3000
      - traefik.http.routers.${DOKPLOY_APP_NAME:-sure}-websecure.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)
      - traefik.http.routers.${DOKPLOY_APP_NAME:-sure}-websecure.entrypoints=websecure
      - traefik.http.routers.${DOKPLOY_APP_NAME:-sure}-websecure.service=${DOKPLOY_APP_NAME:-sure}-websecure-svc
      - traefik.http.routers.${DOKPLOY_APP_NAME:-sure}-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.${DOKPLOY_APP_NAME:-sure}-websecure-svc.loadbalancer.server.port=3000
    networks:
      - sure_net
      - dokploy-network

  worker:
    <<: *sure_image
    command: bundle exec sidekiq
    restart: unless-stopped
    volumes:
      - app-storage:/rails/storage
    environment:
      <<: *rails_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sure_net

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      <<: *db_env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure_net

volumes:
  app-storage:
  postgres-data:
  redis-data:

networks:
  sure_net:
    driver: bridge
  dokploy-network:
    external: true
